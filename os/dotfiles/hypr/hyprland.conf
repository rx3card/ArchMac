# ============================================================
# ArchMac — Configuración de Hyprland
# Estética: flotante por defecto, blur, sombras suaves y
# animaciones con curvas tipo macOS.
# Valores visuales: design/tokens/tokens.json (fuente de verdad).
#
# Sintaxis validada contra Hyprland 0.51–0.54 (hyprlang).
# ⚠️ Desde Hyprland 0.55 el formato clásico está deprecado en favor
# de Lua — la migración está anotada en os/PORTING.md.
# ============================================================

monitor = , preferred, auto, 1

# --- Programas por defecto (provisionales hasta el shell propio, ver ADR-0005) ---
$terminal = kitty
$launcher = wofi --show drun
$mainMod = SUPER            # equivale a ⌘

exec-once = swaybg -i ~/.config/wallpaper/default.jpg -m fill
exec-once = waybar
exec-once = nm-applet
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = wl-paste --type text --watch cliphist store

env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland
# Qt sin decoración propia: la dibuja el sistema (capa 3 del ADR-0004)
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1

general {
    gaps_in = 6
    gaps_out = 14
    border_size = 0          # macOS no usa bordes de color: la profundidad la da la sombra
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 10            # tokens.radius.window

    blur {
        enabled = true
        size = 8
        passes = 3
        popups = true
        vibrancy = 0.17
    }

    shadow {
        enabled = true
        range = 30
        render_power = 3
        color = rgba(00000055)
    }
}

animations {
    enabled = true
    # Curvas tipo macOS: arranque decidido, aterrizaje suave
    bezier = macOut, 0.32, 0.72, 0, 1
    bezier = macIn, 0.40, 0.00, 1.00, 0.60
    bezier = macSoft, 0.25, 0.10, 0.25, 1.00

    animation = windowsIn, 1, 3, macOut, popin 85%
    animation = windowsOut, 1, 3, macIn, popin 85%
    animation = windowsMove, 1, 3, macOut
    animation = fade, 1, 3, macSoft
    animation = workspaces, 1, 4, macOut, slide
    animation = specialWorkspace, 1, 4, macOut, slidevert
}

input {
    kb_layout = us,es
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    touchpad {
        natural_scroll = true      # desplazamiento natural (macOS)
        tap-to-click = true
        clickfinger_behavior = true
        scroll_factor = 0.6
    }
}

# 3 dedos ↔ cambia de espacio (sintaxis de gestos de Hyprland ≥ 0.51)
gesture = 3, horizontal, workspace

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
}

# --- Filosofía macOS: ventanas FLOTANTES por defecto (tiling opcional) ---
windowrule = match:class .*, float on, center on, size 62% 68%

# La barra (waybar) con vidrio
layerrule = blur on, ignore_alpha 0.1, match:namespace waybar

# --- Atajos estilo macOS (⌘ = SUPER) ---
bind = $mainMod, Q, killactive             # ⌘Q cerrar app
bind = $mainMod, SPACE, exec, $launcher    # ⌘Espacio búsqueda
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, F, fullscreen, 0          # botón verde
bind = $mainMod, M, movetoworkspacesilent, special:minimized   # botón amarillo (aprox. hasta el genie nativo)
bind = $mainMod SHIFT, M, togglespecialworkspace, minimized
bind = $mainMod, TAB, cyclenext            # ⌘Tab (overlay visual llegará con el shell)
bind = ALT, TAB, cyclenext
bind = $mainMod, T, togglefloating

# Multimedia y brillo (teclas Fn)
bindel = , XF86AudioRaiseVolume, exec, pamixer -i 5
bindel = , XF86AudioLowerVolume, exec, pamixer -d 5
bindl  = , XF86AudioMute, exec, pamixer -t
bindel = , XF86MonBrightnessUp, exec, brightnessctl s +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 5%-
bindl  = , XF86AudioPlay, exec, playerctl play-pause

# Capturas de pantalla (⌘⇧3 pantalla completa / ⌘⇧4 selección, como macOS)
bind = $mainMod SHIFT, 3, exec, grim ~/captura-$(date +%s).png
bind = $mainMod SHIFT, 4, exec, grim -g "$(slurp)" ~/captura-$(date +%s).png

# Mover / redimensionar con el ratón
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Espacios de trabajo (⌃← / ⌃→ como macOS)
bind = CTRL, right, workspace, e+1
bind = CTRL, left, workspace, e-1
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
