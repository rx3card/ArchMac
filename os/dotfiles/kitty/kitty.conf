# ArchMac — Terminal (kitty)
# Estética: panel oscuro translúcido, tipografía mono del sistema.

font_family      JetBrains Mono
font_size        11.0

window_padding_width 14
hide_window_decorations no
confirm_os_window_close 0

background            #1d1d22
foreground            #f5f5f7
background_opacity    0.88
cursor                #0a84ff
cursor_shape          beam

selection_background  #0a84ff
selection_foreground  #ffffff

# Paleta acorde a los acentos del sistema (tokens.color.accent)
color0  #33333a
color1  #ff453a
color2  #32d74b
color3  #ffd60a
color4  #0a84ff
color5  #bf5af2
color6  #64d2ff
color7  #f5f5f7
color8  #55555e
color9  #ff6961
color10 #31de51
color11 #ffe14d
color12 #409cff
color13 #da8fff
color14 #70d7ff
color15 #ffffff

tab_bar_style powerline
tab_powerline_style round
